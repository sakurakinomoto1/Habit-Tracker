<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link rel="icon" type="image/x-icon" href="/Images/Calendar Image.png" />
    <link href="https://fonts.cdnfonts.com/css/kindegarten" rel="stylesheet" />
  </head>
  <body>
    <!-- title and subtitle -->
    <h1 id="title">Month</h1>
    <h2 id="subtitle">Monthly Habit Tracker</h2>

    <!-- calendar area -->
    <div id="calendarContainer">
      <div id="calendarDiv">
        <div id="calendarHeading">
          <p id="habitTitle">My New Habit</p>
          <p id="totalDays">0/31</p>
        </div>
        <div id="calendarContent">
          <div id="tracker">
            <div class="days">
              <div class="day">1</div>

              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
            </div>
            <div class="days">
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
            </div>
            <div class="days">
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
            </div>
            <div class="days">
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
            </div>
            <div class="days">
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
              <div class="day">1</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button id="resetButton">Reset</button>
  </body>

  <style>
    body {
      background-image: url("Images/Clouds\ Background.png");
      background-color: rgb(255, 227, 227);
      background-blend-mode: lighten;
      text-align: center;
      font-family: "Kindegarten", sans-serif;
    }

    #title {
      margin-top: 100px;
      line-height: 10px;
    }

    #subtitle {
      opacity: 0.7;
      font-size: 18px;
      margin-bottom: 20px;
    }

    #calendarContainer {
      display: flex;
      justify-content: center;
    }

    #calendarDiv {
      background-color: rgb(255, 255, 255);
      border-radius: 10px 10px 20px 20px;
      margin: auto;
      align-content: center;
      text-align: center;
    }

    #calendarHeading {
      display: flex;
      justify-content: space-between;
      border-radius: 10px 10px 0px 0px;
      border: 2px solid black;
      padding: 0px 20px;
      font-size: 20px;
      background-color: pink;
      line-height: 0px;
    }

    #calendarContent {
      padding: 20px;
      border: 2px solid black;
    }

    .days {
      display: flex;
    }

    .day {
      width: 30px;
      margin: 3px;
      padding: 10px;
      font-size: 15px;
      text-align: center;
      border-radius: 20px;
    }
  </style>

  <script>
    // get the date
    var date = new Date();
    console.log(date);

    // extract current date info
    var currentMonth = date.getMonth();
    var currentDay = date.getDay();
    var currentDate = date.getDate();
    var currentYear = date.getFullYear();

    console.log("The current month is " + currentMonth); // current month - 1
    console.log("The current weekday is " + currentDay); // day of the week
    console.log("The current date is " + currentDate); // current date/number
    console.log("The current year is " + currentYear); // current year

    // important date info
    var months = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December",
    ];

    // set the correct month
    var title = document.getElementById("title");
    title.innerHTML = "🌸 " + months[currentMonth] + " 🌸";

    // update the calendar info
    var habitTitle = document.getElementById("habitTitle");
    habitTitle.onclick = function () {
      let habits = prompt("What's your habit?", habitTitle.innerHTML);
      if (!habits) {
        habitTitle.innerHTML = "Click to set your habit";
      } else {
        habitTitle.innerHTML = habits;
      }
    };

    // set the total days
    var daysInTheMonthList = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    var daysInThisMonth = daysInTheMonthList[currentMonth];

    var daysCompleted = 0;
    var totalDays = document.getElementById("totalDays");
    totalDays.innerHTML = "0/" + daysInThisMonth;

    // set up the calendar days
    var dayCount = 0;
    var rowCount = 0;
    var days = document.getElementsByClassName("days");

    for (var i = 0; i < days.length; i++) {
      var day = days[rowCount].getElementsByClassName("day");
      for (var j = 0; j < day.length; j++) {
        if (dayCount == currentDate - 1) {
          day[j].style.color = "rgb(234, 1, 144)";
          day[j].style.border = "2px solid black";
        }

        if (dayCount < daysInThisMonth) {
          day[j].innerHTML = dayCount + 1;
          day[j].setAttribute("id", "day" + (dayCount + 1));
          dayCount++;
        } else {
          day[j].innerHTML = "";
          day[j].setAttribute("style", "background-color: white");
        }
      }
      rowCount++;
    }

    var completed = new Array(31);
    for (var i = 0; i < dayCount; i++) {
      var tempString =
        "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
      console.log("storing date: " + tempString);
      var tempDay = localStorage.getItem(tempString);
      console.log(tempDay);
      if (tempDay == null || tempDay == "false") {
        localStorage.setItem(tempString, "false");
      } else if (tempDay == "true") {
        daysCompleted++;
      }
      totalDays.innerHTML = daysCompleted + "/" + daysInThisMonth;
    }

    console.log("completed array: " + completed);
    console.log("total days completed: " + daysCompleted);

    // check storage and update completed array
    for (var i = 0; i < currentDate; i++) {
      var tempString =
        "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
      console.log(tempString);

      var chosenDay = localStorage.getItem(tempString);
      console.log(i + 1 + ": " + chosenDay);
      var chosenDayDiv = document.getElementById("day" + (i + 1));
      if (chosenDay === "true") {
        chosenDayDiv.style.backgroundColor = "pink";
      } else if (chosenDay === "false") {
        chosenDayDiv.style.backgroundColor = "white";
      }
    }

    var dayDivs = document.querySelectorAll(".day");
    for (var i = 0; i < currentDate; i++) {
      dayDivs[i].onclick = function (e) {
        var num = e.target.innerText;
        var selectedDate = document.getElementById(e.target.id);
        var storageString =
          "" + (currentMonth + 1) + "-" + num + "-" + currentYear;
        if (localStorage.getItem(storageString) === "false") {
          selectedDate.style.backgroundColor = "pink";
          localStorage.setItem(storageString, "true");
          daysCompleted++;
        } else if (localStorage.getItem(storageString) === "true") {
          selectedDate.style.backgroundColor = "white";
          localStorage.setItem(storageString, "false");
          daysCompleted--;
        }
        totalDays.innerHTML = daysCompleted + "/" + dayCount;
        console.log(daysCompleted, currentDate);
        if (daysCompleted === currentDate) {
          alert("great progress");
        }
      };
    }

    var resetButton = document.getElementById("resetButton");
    resetButton.onclick = function () {
      for (var i = 0; i < dayCount; i++) {
        var tempStrings =
          "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
        console.log(tempStrings);
        localStorage.setItem(tempStrings, "false");
        var curDay = document.getElementById("day" + (i + 1));
        curDay.style.backgroundColor = "white";
      }
      daysCompleted = 0;
      totalDays.innerHTML = daysCompleted + "/" + daysInThisMonth;
    };
  </script>
</html>
